status:
  scope: >-
    Proved: the six compared theorems for the definitions of Challenge.lean (∃ℝ-completeness of
    the orthogonal point-point and point-boundary art gallery problems, their membership in ∃ℝ,
    and membership by formulas in the 2g guard coordinates). On the way: the ETR → ETR-INV and
    ETR → ETR-INV-REV reductions with their polynomial-time proofs; membership of the art
    gallery problems in ∃ℝ with 2g variables; Stade's construction; the orthogonal construction
    (simplicity, orthogonality, the region as a union of rectangles, counting with
    kernel-checked visibility certificates, pinning of the helper guards, soundness,
    completeness by coverage certificates, polynomial time, and the elimination of the
    constraints x = 1); a library of visibility tools for polygons with verified certificate
    checkers. Not covered: hardness of the boundary-point variant (guards on the boundary) for
    orthogonal polygons.
