version: "v0.4"

project:
  name: "The orthogonal art gallery problem is ∃ℝ-complete (point-point and point-boundary), in Lean 4"
  description: >-
    A Lean 4 formalization of material in a forthcoming manuscript entitled "The Orthogonal Art
    Gallery Problem is ∃ℝ-complete". A Lean 4 and Mathlib proof, for an explicit single-tape
    Turing machine model, that deciding
    whether an orthogonal simple polygon (every edge horizontal or vertical) with rational
    corners can be guarded by g guards is ∃ℝ-complete under polynomial-time many-one
    reductions, both when the guards must see the whole polygon (point-point) and when they must
    see only its boundary (point-boundary). Both problems also reduce to ETR by formulas whose
    only variables are the 2g coordinates of the guards. As far as we could determine, hardness
    for orthogonal polygons was open: it is treated neither by Abrahamsen, Adamaszek and Miltzow
    (J. ACM 2021) nor by Stade (SoCG 2025). The hardness proof is a new construction derived
    from Stade's polygon: needles become corridors, wedges become rectangles with needle
    cutters, the slanted mouths of the copy nooks are kept through helper guards pinned by
    four-armed crosses, and the addition gadgets are replaced by new orthogonal rooms. Its
    visibility, pinning and coverage facts are checked by the kernel as certificates (cone
    propagation with a symbolic height parameter, polynomial sign tests for the copy nooks,
    coverage by convex items). The proofs use only the axioms propext, Classical.choice and
    Quot.sound.
  authors:
    - "Robert D. Barish"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Robert D. Barish"

