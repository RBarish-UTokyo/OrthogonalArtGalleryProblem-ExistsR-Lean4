      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: comparator.json
    - declaration: ArtGallery.agpOrthPointBoundary_erComplete
      file: ArtGallery/Orthogonal/MainTheorems.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: comparator.json
    - declaration: ArtGallery.agpOrth_inER
      file: ArtGallery/Orthogonal/MembershipMain.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: comparator.json
    - declaration: ArtGallery.agpOrth_inER_guard_variables
      file: ArtGallery/Orthogonal/MembershipMain.lean
      sorry_count: 0
      axioms: [propext, Classical.choice, Quot.sound]
      comparator_config: comparator.json
    - declaration: ArtGallery.agpOrthPointBoundary_inER
