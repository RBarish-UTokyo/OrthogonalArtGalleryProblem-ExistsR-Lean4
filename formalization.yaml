fidelity:
  divergences: |-
    - Machine model, polynomial time and reductions are those of PALOMAR-2026-10-02-000013: deterministic single-tape Turing machines over {blank, 0, 1, separator}, time = number of steps, polynomial bounds c * (n + 1)^k, polynomial-time many-one (Karp) reductions. ∃ℝ is the class of languages that reduce to ETR; invariance under other machine models is not proved.
    - ETR formulas are quantifier-free formulas with constants 0, 1, operations +, −, · and relations =, <, ≤ under ¬, ∧, ∨, read existentially; variable indices are coded in unary. Art gallery instances are coded with numerators, denominators and g in binary.
    - Polygons are lists of corners; simple means at least three distinct corners and any two distinct edges meeting exactly in common endpoints (collinear consecutive corners allowed); orthogonal means every edge is horizontal or vertical. The region is the boundary plus the bounded components of its complement; seeing means the closed segment lies in the region. The problems ask for a guard set with exactly g points, which is equivalent to at most g points since guards can be added.
    - The orthogonal problems are not treated in the sources; AGPOrth and AGPOrthPointBoundary are the restrictions of the point-point problem of [AAM] and of the point-boundary problem of [S] to orthogonal polygons. Hardness is proved by a construction of our own (the forthcoming manuscript): Stade's polygon with every non-axis-parallel edge replaced, extra helper guards counted in the guard number, and a preprocessing step that replaces each constraint x = 1 by x · x ≥ 1 and x + x ≤ y with a fresh variable y.
    - Stade's construction is formalized with explicit coordinates designed for the formalization rather than the coordinates of the paper.

review:
  status: agent-reviewed
  reviewers:
    - "Claude Opus 5.5 (Anthropic)"
  notes: >-
    The Challenge statement was checked against the definitions of the sources during the
    AI-assisted development. The proof is checked by the Lean kernel, and Comparator verifies
    that the solution proves the challenge statement using only the permitted axioms
    (docs/VERIFICATION.md). No human mathematical review or Palomar editorial review is
    asserted.

alignment:
  namespace: "ArtGallery"
  statements:
    - source: "[Manuscript] the orthogonal art gallery problem (point-point) is ∃ℝ-complete"
      lean: "ArtGallery.agpOrth_erComplete"
      module: "Solution"
      status: proved
      note: "The main theorem of the forthcoming manuscript; orthogonal construction of that manuscript."
    - source: "[Manuscript] the orthogonal point-boundary art gallery problem is ∃ℝ-complete"
      lean: "ArtGallery.agpOrthPointBoundary_erComplete"
      module: "Solution"
      status: proved
      note: "Same construction as for the point-point variant."
    - source: "Membership of the two orthogonal variants in ∃ℝ ([AAM] Theorem 13 restricted to orthogonal polygons)"
      lean: "ArtGallery.agpOrth_inER, ArtGallery.agpOrthPointBoundary_inER"
      module: "Solution"
      status: proved
    - source: "[AAM] §7.2 open problem on the number of variables, for orthogonal polygons"
      lean: "ArtGallery.agpOrth_inER_guard_variables, ArtGallery.agpOrthPointBoundary_inER_guard_variables"
      module: "Solution"
      status: proved
      note: "2g variables (the guard coordinates) suffice."

